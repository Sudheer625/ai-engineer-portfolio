<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Singidi Sai Naga Sudheer Portfolio</title>
  <desc id="desc">Open Graph preview image for an AI Engineer portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f6fb8"/>
      <stop offset="1" stop-color="#28c7a0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.44 0 0 0 0 0.72 0 0 0 0.35 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="250" cy="120" r="180" fill="#37b7ff" opacity="0.16" filter="url(#glow)"/>
  <circle cx="980" cy="520" r="220" fill="#28c7a0" opacity="0.15" filter="url(#glow)"/>
  <rect x="90" y="86" width="1020" height="458" rx="34" fill="rgba(255,255,255,0.72)" stroke="#d8e7ef"/>
  <rect x="135" y="136" width="112" height="112" rx="24" fill="url(#brand)"/>
  <text x="191" y="204" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">SSNS</text>
  <text x="135" y="326" font-family="Poppins, Arial, sans-serif" font-size="58" font-weight="700" fill="#102033">Singidi Sai Naga Sudheer</text>
  <text x="135" y="386" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" fill="#0f6fb8">Junior AI Engineer • Python Developer</text>
  <text x="135" y="438" font-family="Poppins, Arial, sans-serif" font-size="24" fill="#607085">AI Workflows • Machine Learning • React • Full-Stack Applications</text>
</svg>
